<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: #3B82F6 to #1D4ED8 -->
    <linearGradient id="calcBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Calculator Body: Rounded Square -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#calcBody)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="40" y="40" width="432" height="432" rx="92" fill="none" stroke="#93C5FD" stroke-width="6" stroke-opacity="0.4" />

  <!-- Calculator Screen: Pure White -->
  <rect x="84" y="84" width="344" height="100" rx="20" fill="#FFFFFF" />
  
  <!-- Screen Digital Readout Line -->
  <rect x="260" y="118" width="144" height="32" rx="12" fill="#1D4ED8" />

  <!-- White Calculator Buttons Grid (3 Columns x 3 Rows) -->
  <!-- Row 1 -->
  <rect x="84" y="216" width="88" height="60" rx="16" fill="#FFFFFF" />
  <rect x="212" y="216" width="88" height="60" rx="16" fill="#FFFFFF" />
  <rect x="340" y="216" width="88" height="60" rx="16" fill="#FFFFFF" />

  <!-- Row 2 -->
  <rect x="84" y="300" width="88" height="60" rx="16" fill="#FFFFFF" />
  <rect x="212" y="300" width="88" height="60" rx="16" fill="#FFFFFF" />
  <rect x="340" y="300" width="88" height="60" rx="16" fill="#FFFFFF" />

  <!-- Row 3 -->
  <rect x="84" y="384" width="88" height="60" rx="16" fill="#FFFFFF" />
  <rect x="212" y="384" width="88" height="60" rx="16" fill="#FFFFFF" />
  <rect x="340" y="384" width="88" height="60" rx="16" fill="#93C5FD" />
</svg>
