<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: #3B82F6 to #1D4ED8 -->
    <linearGradient id="calcBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Screen Gradient -->
    <linearGradient id="calcScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Action Button Gradient -->
    <linearGradient id="actionBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Calculator Body: Rounded Square -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#calcBody)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="#93C5FD" stroke-width="6" stroke-opacity="0.4" />

  <!-- Calculator Screen -->
  <rect x="80" y="80" width="352" height="100" rx="24" fill="url(#calcScreen)" />
  
  <!-- Screen Digital Readout Line / Indicator -->
  <rect x="260" y="118" width="144" height="24" rx="12" fill="#1E40AF" />
  <circle cx="236" cy="130" r="10" fill="#2563EB" />

  <!-- Buttons Grid (3 Columns x 3 Rows) -->
  <!-- Row 1: y = 216 -->
  <!-- Col 1: x = 80 -->
  <rect x="80" y="216" width="96" height="64" rx="18" fill="#FFFFFF" />
  <!-- Col 2: x = 208 -->
  <rect x="208" y="216" width="96" height="64" rx="18" fill="#FFFFFF" />
  <!-- Col 3: x = 336 (Action/Operator) -->
  <rect x="336" y="216" width="96" height="64" rx="18" fill="#BFDBFE" />
  <!-- Plus symbol in Col 3 -->
  <path d="M 384 236 L 384 260 M 372 248 L 396 248" stroke="#1D4ED8" stroke-width="6" stroke-linecap="round" />

  <!-- Row 2: y = 304 -->
  <!-- Col 1: x = 80 -->
  <rect x="80" y="304" width="96" height="64" rx="18" fill="#FFFFFF" />
  <!-- Col 2: x = 208 -->
  <rect x="208" y="304" width="96" height="64" rx="18" fill="#FFFFFF" />
  <!-- Col 3: x = 336 (Action/Operator) -->
  <rect x="336" y="304" width="96" height="64" rx="18" fill="#BFDBFE" />
  <!-- Minus symbol in Col 3 -->
  <path d="M 372 336 L 396 336" stroke="#1D4ED8" stroke-width="6" stroke-linecap="round" />

  <!-- Row 3: y = 392 -->
  <!-- Col 1: x = 80 -->
  <rect x="80" y="392" width="96" height="64" rx="18" fill="#FFFFFF" />
  <!-- Col 2: x = 208 -->
  <rect x="208" y="392" width="96" height="64" rx="18" fill="#FFFFFF" />
  <!-- Col 3: x = 336 (Equals Button: Accent Blue) -->
  <rect x="336" y="392" width="96" height="64" rx="18" fill="url(#actionBtn)" />
  <!-- Equals symbol in Col 3 -->
  <path d="M 372 418 L 396 418 M 372 430 L 396 430" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
</svg>
